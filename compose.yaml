services:
  guide:
    build: .
    ports:
      - "${GUIDE_PORT:-3000}:3000"
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      GUIDE_FILE: /app/data/guide.json
    volumes:
      - ./data:/app/data:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: "5m"
        max-file: "2"
