# Replace PUBLIC_IP and APP_PORT. Replace the bootstrap server with this file after issuance.
server {
    listen 80;
    server_name PUBLIC_IP;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://PUBLIC_IP$request_uri; }
}
server {
    listen 443 ssl;
    server_name PUBLIC_IP;
    ssl_certificate /etc/letsencrypt/live/PUBLIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PUBLIC_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24k;
    client_body_timeout 10s;
    location / {
        proxy_pass http://127.0.0.1:APP_PORT;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 110s;
        proxy_send_timeout 15s;
        proxy_cache off;
    }
}
